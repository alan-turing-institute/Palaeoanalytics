# PyLithics Configuration File
# This file allows you to customize the behavior of PyLithics.

# DPI-Aware Processing Configuration
dpi_processing:
  enabled: false  # Enable DPI-aware kernel scaling for preprocessing
                  # - true: Kernel sizes scale with image DPI for consistent results
                  # - false: Use fixed kernel sizes (recommended for archaeological line drawings)

  reference_dpi: 300.0  # Reference DPI for parameter calibration
                        # All base kernel sizes are optimized for this DPI
                        # Kernels will be scaled for images with different DPIs

  max_scale_factor: 1.5   # Maximum allowed scaling factor (conservative for line drawings)
                          # Prevents over-processing of clean line art
                          # Example: At 600 DPI, scale factor would be 2.0 but limited to 1.5

  # Scaling mode for when DPI-aware processing is enabled
  scaling_mode: standard      # conservative | standard | aggressive
                             # conservative: Minimal scaling, preserves fine details
                             # standard: Moderate scaling for mixed content (default)
                             # aggressive: Full DPI-proportional scaling

  # Base kernel sizes (optimized for reference_dpi)
  base_kernels:
    gaussian_blur: 5      # Base Gaussian blur kernel size
    adaptive_block: 11    # Base adaptive threshold block size
    morphological: 3      # Base morphological closing kernel size

thresholding:
  method: simple  # Choose the thresholding method:
                  # - "simple" thresholding uses a fixed threshold value (see threshold_value below) and is the "default" method.
                  # - "adaptive" adjusts the threshold based on local image regions.
                  # - "otsu" calculates the optimal threshold value automatically.

  threshold_value: 127  # Only used for "simple" thresholding. This sets the threshold value.
                        # Any pixel intensity above this value is set to max_value, and below this is set to 0.

  max_value: 255  # Maximum pixel intensity after thresholding.
                  # Typically set to 255 (for binary images), but you can change this if needed.

  debug_output: false  # Write the black-and-white image of each lithic to
                       # results/threshold_debug/<image>.png. CLI flag: --threshold_debug

normalization:
  enabled: true  # Enable or disable image normalization (contrast adjustment).
                 # - true: Normalization is applied.
                 # - false: Normalization is skipped.

  method: minmax  # Choose the normalization method:
                  # - "minmax" rescales pixel intensities to the range specified by clip_values.
                  # - "zscore" standardizes the image (mean 0, standard deviation 1).
                  # - "custom" is reserved for advanced users who define custom methods.

  clip_values: [0, 255]  # The range to which pixel values are scaled during normalization.
                         # By default, values are scaled to between 0 and 255.

grayscale_conversion:
  enabled: true  # Enable or disable grayscale conversion.
                 # - true: Converts the image to grayscale before further processing.
                 # - false: Skips grayscale conversion.

  method: standard  # Choose the grayscale conversion method:
                    # - "standard" converts RGB images to grayscale.
                    # - "clahe" enhances image contrast using localized histogram equalization.

morphological_closing:
  enabled: true  # Enable or disable morphological closing.
  kernel_size: 3  # Size of the kernel for morphological closing (default is 3x3).

logging:
  level: INFO  # Set the logging level:
               # - "DEBUG" provides detailed logs for troubleshooting.
               # - "INFO" provides general logs (recommended for most users).
               # - "WARNING" logs potential issues.
               # - "ERROR" logs only critical errors that prevent PyLithics from running.

  log_to_file: true  # Enable or disable logging to a file.
                     # - true: Logs will be saved alongside the run's
                     #   results/ folder as pylithics.log.
                     # - false: Logs will only appear in the console.

  # log_file:  # Optional. Uncomment and set an explicit path to override
              # the default, which is <data_dir>/results/pylithics.log.
              # If left commented, the log lands next to the analysis
              # output so it follows your dataset, not your shell cwd.

contour_filtering:
  min_area: 50.0  # Minimum contour area in pixels
  exclude_border: true  # Whether to exclude contours touching the image border

# Arrow Detection Configuration
arrow_detection:
  enabled: true  # Enable or disable arrow detection
                 # - true: Arrow detection will be performed on scar contours
                 # - false: Skip arrow detection entirely

  reference_dpi: 300.0  # Reference DPI for parameter calibration
                        # Detection thresholds are calibrated for this DPI value
                        # Parameters will be scaled for images with different DPIs

  # Scale factors for adjusting detection sensitivity
  # Values between 0 and 1 make detection more permissive
  # Values closer to 1 make detection more restrictive
  min_area_scale_factor: 0.7  # Safety margin for minimum area threshold
  min_defect_depth_scale_factor: 0.8  # Safety margin for convexity defect depth
  min_triangle_height_scale_factor: 0.8  # Safety margin for triangle height

  debug_enabled: false  # Write the arrow found in each scar, and the steps, to
                        # results/arrow_debug/<image>/<scar>.png and .txt
                        # CLI flag: --arrow_debug

  show_arrow_lines: false  # Draw red arrow lines on detected arrows
                           # - true: Draw both light blue contour outlines AND red arrow lines
                           # - false: Draw only light blue contour outlines (default)

# Arrow Integration Configuration
# Controls how detected arrows are matched to scar contours
arrow_integration:
  min_candidate_area: 1.0    # Minimum contour area (pixels) to consider as arrow candidate
  min_solidity: 0.4          # Minimum solidity for arrow-shaped contours (0-1)
  max_solidity: 0.9          # Maximum solidity for arrow-shaped contours (0-1)
  area_match_tolerance: 1.0  # Tolerance for matching contours by area (pixels)

  # Advanced parameters (modify with caution)
  reference_thresholds:
    min_area: 1  # Minimum contour area at reference DPI
    min_defect_depth: 2  # Minimum convexity defect depth at reference DPI
    solidity_bounds: [0.4, 1.0]  # Acceptable solidity range for arrow shapes
    min_triangle_height: 8  # Minimum triangle height at reference DPI
    min_significant_defects: 2  # Required number of significant defects

# Surface Classification Configuration
surface_classification:
  enabled: true  # Enable surface type classification
  tolerance: 0.1  # Dimensional tolerance for surface comparison (0-1)

  # Classification rules based on contour hierarchy and properties
  classification_rules:
    dorsal_area_threshold: 0.6  # Minimum relative area for dorsal classification
    platform_aspect_ratio_max: 0.3  # Maximum aspect ratio for platform classification
    lateral_area_threshold: 0.1  # Maximum relative area for lateral classification

# Symmetry Analysis Configuration
symmetry_analysis:
  enabled: true  # Enable symmetry analysis for dorsal surfaces

  # Symmetry calculation parameters
  reflection_axes: 8  # Number of reflection axes to test
  symmetry_threshold: 0.7  # Minimum symmetry score to consider symmetric
  calculation_method: area_based  # Method for symmetry calculation

  # Surface types to analyze
  surfaces:
    dorsal: true
    ventral: false
    platform: true
    lateral: true

  # Include scars on surfaces
  include_scars:
    dorsal: true
    ventral: false
    platform: false
    lateral: false

# Lateral Analysis Configuration
lateral_analysis:
  enabled: true  # Enable lateral surface convexity analysis

# Voronoi Analysis Configuration
voronoi_analysis:
  enabled: true  # Enable Voronoi diagram generation

  # Voronoi calculation parameters
  padding_factor: 0.02  # Padding around contours for Voronoi calculation
  min_distance_threshold: 5.0  # Minimum distance between Voronoi points

# Visualization Configuration
visualization:
  save_images: true  # Save visualization images
  image_format: png  # Output image format (png, jpg, tiff)

  # Color scheme for different elements
  colors:
    parent_contour: [0, 255, 0]  # Green for parent contours
    child_contour: [255, 0, 0]   # Red for child contours
    arrow: [0, 255, 255]         # Cyan for arrows
    text: [255, 255, 255]        # White for text labels

  font_scale: 0.7  # Font size for labels
  line_thickness: 2  # Line thickness for contours and arrows

# Cortex Detection Configuration
cortex_detection:
  enabled: true  # Enable or disable cortex detection
                 # - true: Cortex detection will be performed on child contours
                 # - false: Skip cortex detection entirely

  # Detection sensitivity parameters
  # Lower values make detection more sensitive (detect more cortex)
  # Higher values make detection more restrictive (detect less cortex)
  stippling_density_threshold: 0.2  # Minimum density of small components (stippling)
                                    # Range: 0.1-1.0, typical: 0.2
  
  texture_variance_threshold: 100   # Minimum texture variance for cortex
                                    # Range: 50-500, typical: 100
  
  edge_density_threshold: 0.05      # Minimum edge density from stippling
                                    # Range: 0.01-0.2, typical: 0.05

# Scar Complexity Configuration
scar_complexity:
  enabled: true  # Enable or disable scar complexity analysis
                 # - true: Count border-sharing relationships for dorsal scars
                 # - false: Skip scar complexity analysis
  
  distance_threshold: 10.0  # Distance threshold in pixels for adjacency detection
                            # Scars within this distance are considered adjacent
                            # Typical range: 3.0-20.0 pixels
                            # Lower values = stricter adjacency detection
                            # Higher values = more permissive adjacency detection

# Data Export Configuration
data_export:
  csv: true  # Always write the consolidated processed_metrics.csv
  json_per_lithic: false  # Set to true to also write one JSON file per lithic
                          # to results/json/{image_stem}.json. CLI flag
                          # --export_json overrides this to true.

# Scale Calibration Configuration
scale_calibration:
  enabled: true  # Enable or disable scale bar calibration
                # - true: Detect and measure scale bars from scale images
                # - false: Skip scale calibration, use pixel measurements only

  debug_output: false  # Write the scale image with the bar that was found to
                      # results/scale_debug/<scale image>.png. CLI flag: --scale_debug

# Page Segmentation Configuration (pylithics-pages)
# Cuts a scanned plate of lithic illustrations into one image per artefact.
# This stage NEVER alters saved pixels: thresholding here is detection-only
# scaffolding used to locate ink, then discarded. Crops are cut from the
# source image untouched, so the main pipeline remains the single place
# where enhancement happens.
page_segmentation:
  enabled: true  # Enable or disable page segmentation

  grouping:
    # All distances are fractions of page width (W) or height (H), so the
    # same settings work across page sizes at a given resolution.
    gap: 0.025  # Side-by-side views closer than this are ONE artefact
                # - Raise if one artefact is being split apart
                # - Lower if two artefacts are being merged
                # - Typical range: 0.01 - 0.08

    narrow: 0.07  # A narrow view (profile/section) joins a neighbour within
                  # this distance. Profiles are thin outlines drawn beside
                  # the surface they belong to.
                  # - Typical range: 0.02 - 0.12

    vertical_gap: 0.06  # A short view directly under a taller one (a
                        # cross-section) joins it within this distance.
                        # - Typical range: 0.03 - 0.10

    bridge: 0.06  # Views linked by a dash or rule mark within this distance
                  # are joined. Illustrators use these to tie views together.
                  # - Typical range: 0.03 - 0.10

    min_area: 0.0004  # Blobs smaller than this fraction of page area are
                      # treated as labels/arrows and attached to the nearest
                      # artefact rather than becoming artefacts themselves.
                      # - Typical range: 0.0001 - 0.001

  export:
    padding: 20  # Pixels of whitespace kept around each crop
                 # - Typical range: 0 - 60

    manifest: true  # Write pages_manifest.csv recording every crop's source page,
                    # bounding box, DPI, and colour mode. Required for
                    # reproducible research; disable only for quick tests.

  scale_bars:
    enabled: true  # Export detected page scale bars as their own crops to
                   # scales/{page_stem}_scale_bar.png

    include_caption: true  # Union the caption text ("5 cm") into the bar's
                           # crop so the exported image is self-describing.
                           # Captions are still excluded from artefact crops.

    min_aspect_ratio: 5.0  # Width:height below which a component is not
                           # considered a bar
                           # - Typical range: 3.0 - 10.0

    max_height: 0.06  # A bar is never taller than this fraction of page H
                      # - Typical range: 0.02 - 0.10

  text_rejection:
    enabled: true  # Discard captions, legend text and legend keys before
                   # grouping, so they are never exported or attached to
                   # an artefact. Identifier numerals are unaffected.

    min_pieces: 3  # A word breaks into at least this many letter-sized
                   # pieces of ink. Measured: text median 8, drawings 1.

    max_piece_share: 0.5  # No single piece holds more of the ink than
                          # this. A lithic outline holds ~97% of its own.

    min_aligned: 0.75  # Share of letter-sized pieces sitting on one
                       # baseline. Descenders (g, p, y) fall below it,
                       # so a five-letter word with one scores 0.8.

    max_height: 0.05  # Text is never taller than this fraction of page H.
                      # Measured across 45 pages: text <= 0.052, hatched
                      # surfaces and large drawings 0.06 - 0.46.
                      # - Raise if large legend text on a small page is
                      #   being exported as an artefact

    min_density: 0.12  # Hollow-outline guard, well below any text
                       # (measured 0.15 - 0.47)

    swatch_density: 0.90  # A solid block this full is a legend key
    swatch_max_size: 0.06  # ...when no larger than this fraction of the
                           # smaller page dimension

  identifiers:
    enabled: true  # Read the number or letter printed beside each lithic
                   # and name its crop {page}_figure_{label}. Needs the
                   # optional RapidOCR extra (pip install "PyLithics[ocr]");
                   # without it crops keep their reading-order names.

    min_confidence: 0.6  # Reads below this OCR confidence are dropped
                         # rather than trusted. A crop with no trusted
                         # read keeps its reading-order name.

    ring_density: 0.04  # Ink allowed in a ring around a glyph, as a
                        # fraction of the ring. A printed identifier sits
                        # in clear space (measured median 0.000); stipple
                        # and hatching do not.

    reach: 1.5  # An identifier outside every artefact box belongs to the
                # nearest box when within this many glyph heights of it and
                # no other. Raise for plates that set the label well clear
                # of the drawing (Late Acheulian sets letters above-left,
                # about 3 glyph heights away).

  debug:
    enabled: false  # Write pages_debug/{page}.png with numbered boxes. CLI flag: --debug
                    # drawn, so splits can be checked and corrected via the
                    # overrides CSV
